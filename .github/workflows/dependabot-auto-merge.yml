name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Dependency checks
    types:
      - completed
  schedule:
    - cron: "30 03 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for passing Dependabot pull requests
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            for (const pull of pulls.filter(({ user }) => user?.login === 'dependabot[bot]')) {
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pull.head.sha,
                per_page: 100,
              });

              const dependencyCheck = checks.data.check_runs.find(
                (check) => check.name === 'dependency-check',
              );

              if (
                !dependencyCheck ||
                dependencyCheck.status !== 'completed' ||
                dependencyCheck.conclusion !== 'success'
              ) {
                core.info(`Skipping #${pull.number}: dependency checks have not passed.`);
                continue;
              }

              try {
                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(
                      input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }
                    ) {
                      pullRequest { number }
                    }
                  }`,
                  { pullRequestId: pull.node_id },
                );
                core.info(`Enabled auto-merge for #${pull.number}.`);
              } catch (error) {
                core.warning(`Could not enable auto-merge for #${pull.number}: ${error.message}`);
              }
            }
