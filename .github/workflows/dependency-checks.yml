name: Dependency checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: dependency-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pip-audit

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run security regression test
        env:
          DJANGO_SETTINGS_MODULE: ttsbot.settings
        run: python -m unittest app.tests.SoupSieveSecurityTests

      - name: Audit dependencies
        run: pip-audit -r requirements.txt
