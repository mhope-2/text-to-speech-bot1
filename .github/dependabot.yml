version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: master
    schedule:
      interval: daily
      time: "03:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: daily
      time: "03:15"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
